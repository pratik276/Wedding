<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashma & Pratik</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* General Styles */
      body {
        font-family: "Roboto", sans-serif;
        margin: 0;
        padding: 0;
        color: #333;
        line-height: 1.6;
      }

      h1,
      h2,
      h3 {
        font-family: "Playfair Display", serif;
        font-weight: 700;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      /* Landing Page */
      #landing {
        background: url("landing-image.jpg") no-repeat center center/cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #fff;
        position: relative;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #landing.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .landing-content h1 {
        font-size: 4rem;
        margin: 0;
      }

      .landing-content p {
        font-size: 1.5rem;
        margin: 10px 0;
      }

      .enter-button {
        background: #ffcccb;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 1.2rem;
        transition: background 0.3s ease;
        color: #333;
        cursor: pointer;
      }

      .enter-button:hover {
        background: #ffb6b5;
      }

      /* Main Content */
      .main-content {
        display: block;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .main-content.visible {
        opacity: 1;
        visibility: visible;
      }

      /* Hero Section */
      #hero {
        background: url("hero-image.jpg") no-repeat center center/cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #fff;
        position: relative;
      }

      .hero-content h1 {
        font-size: 4rem;
        margin: 0;
      }

      .hero-content p {
        font-size: 1.5rem;
        margin: 10px 0;
      }

      .cta-button {
        background: #ffcccb;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 1.2rem;
        transition: background 0.3s ease;
        color: #333;
      }

      .cta-button:hover {
        background: #ffb6b5;
      }

      /* Navigation */
      nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
      }

      nav h1 {
        font-size: 1.5rem;
        margin: 0;
      }

      nav ul {
        display: flex;
        list-style-type: none;
        padding: 0;
        margin: 0;
      }

      nav ul li {
        margin: 0 15px;
      }

      nav ul li a {
        color: #fff;
        font-weight: bold;
      }

      /* Sections */
      section {
        padding: 50px 20px;
        text-align: center;
      }

      section h2 {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      section p {
        font-size: 1.1rem;
        max-width: 800px;
        margin: 0 auto;
      }

      /* Story Section */
      #story {
        background: #f9f9f9;
      }

      /* Event Details */
      #details {
        background: #fff;
      }

      /* Venue Location */
      #venue iframe {
        width: 100%;
        height: 400px;
        border: none;
        margin-top: 20px;
      }

      /* RSVP Section */
      #rsvp {
        background: #f9f9f9;
      }

      #rsvp iframe {
        width: 100%;
        height: 1000px;
        border: none;
      }

      /* Footer */
      footer {
        padding: 20px;
        text-align: center;
        background: #333;
        color: #fff;
      }

      footer a {
        color: #ffcccb;
      }

      footer a:hover {
        color: #ffb6b5;
      }
    </style>
  </head>
  <body>
    <!-- Landing Page -->
    <section id="landing">
      <div class="landing-content">
        <h1>Ashma & Pratik</h1>
        <p>We're getting married</p>
        <button class="enter-button" onclick="enterMainPage()">ENTER</button>
      </div>
    </section>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Navigation -->
      <nav>
        <h1>Ashma & Pratik</h1>
        <ul>
          <li><a href="#story">Our Story</a></li>
          <li><a href="#details">Event Details</a></li>
          <li><a href="#venue">Venue</a></li>
          <li><a href="#rsvp">RSVP</a></li>
        </ul>
      </nav>

      <!-- Hero Section -->
      <section id="hero">
        <div class="hero-content">
          <h1>Ashma & Pratik</h1>
          <p>February 13, 2025</p>
          <a href="#rsvp" class="cta-button">RSVP</a>
        </div>
      </section>

      <!-- Additional Sections -->
      <!-- Add your remaining sections here -->

      <!-- Footer -->
      <footer>
        <p>© 2025 Ashma & Pratik. Made with ❤️</p>
        <div class="social-links">
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-facebook"></i></a>
        </div>
      </footer>
    </div>

    <script>
      function enterMainPage() {
        const landing = document.getElementById("landing");
        const mainContent = document.querySelector(".main-content");
        landing.classList.add("hidden"); // Hide the landing page
        mainContent.classList.add("visible"); // Show the main content
      }
    </script>
  </body>
</html>
